apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vast-vss-app.fullname" . }}-frontend-nginx
  labels:
    {{- include "vast-vss-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen {{ .Values.frontend.port }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size {{ .Values.frontend.nginx.maxBodySize }};
        client_body_timeout {{ .Values.frontend.nginx.clientBodyTimeout }};
        send_timeout {{ .Values.frontend.nginx.sendTimeout }};

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            proxy_pass http://{{ include "vast-vss-app.fullname" . }}-backend:{{ .Values.backend.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout {{ .Values.frontend.nginx.proxyConnectTimeout }};
            proxy_send_timeout {{ .Values.frontend.nginx.proxySendTimeout }};
            proxy_read_timeout {{ .Values.frontend.nginx.proxyReadTimeout }};
        }
    }
