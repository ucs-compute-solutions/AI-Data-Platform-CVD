name: Warehouse security and tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warehouse-security-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify complete Warehouse payload and run offline regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B warehouse-vss-demo/verify.py --tests
