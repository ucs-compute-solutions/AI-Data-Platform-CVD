# One-shot source classes represented as bounded Kubernetes Jobs. None is
# render-ready yet: the derived helper images/scripts and immutable digests are
# unresolved. Enabling a blocked entry intentionally fails Helm rendering.
initializationJobs:
  kafkaTopics:
    enabled: false
    implementationStatus: blocked-unpinned-jq
    image: kafka
    serviceAccount: general
    command: []
    args: []
    configMapMounts:
      - {configMap: kafkaTopics, mountPath: /opt/warehouse/kafka, readOnly: true}
    secretEnv: []
    backoffLimit: 3
    activeDeadlineSeconds: 600
  brokerGate:
    enabled: false
    implementationStatus: blocked-derived-image
    image: ""
    serviceAccount: general
    command: []
    args: []
    configMapMounts: []
    secretEnv: []
    backoffLimit: 3
    activeDeadlineSeconds: 300
  elasticsearchInit:
    enabled: false
    implementationStatus: blocked-derived-image
    image: ""
    serviceAccount: general
    command: []
    args: []
    configMapMounts:
      - {configMap: elasticsearchInit, mountPath: /opt/warehouse/elasticsearch, readOnly: true}
    secretEnv: []
    backoffLimit: 3
    activeDeadlineSeconds: 600
  kibanaDashboard:
    enabled: false
    implementationStatus: blocked-derived-image
    image: ""
    serviceAccount: general
    command: []
    args: []
    configMapMounts:
      - {configMap: kibanaDashboard2d, mountPath: /opt/warehouse/kibana, readOnly: true}
    secretEnv: []
    backoffLimit: 3
    activeDeadlineSeconds: 600
  calibrationImport:
    enabled: false
    implementationStatus: blocked-derived-image
