# NetworkPolicy remains a separate acknowledgement gate because source-to-
# OpenShift flows still require runtime verification. When enabled it renders
# default deny plus only the explicitly selected allowances.
networkPolicies:
  enabled: false
  acknowledgeIncomplete: false
  allowSameRelease: false
  dns:
    enabled: false
    namespaceSelector: {}
    podSelector: {}
  routerIngress:
    enabled: false
    namespaceSelector: {}
    podSelector: {}

# Stateful data services. Each entry is independently disabled. The commands,
# configuration, resource sizes, and probes are scaffolding, not accepted
# runtime settings.
statefulServices:
  kafka:
    enabled: false
    image: kafka
    serviceAccount: general
    replicas: 1
    headless: true
    ports:
      - name: broker
        port: 9092
        protocol: TCP
      - name: controller
        port: 9093
        protocol: TCP
    probe:
      enabled: true
      type: tcp
      port: broker
      path: ""
      startupFailureThreshold: 60
      periodSeconds: 10
    env:
      KAFKA_HEAP_OPTS: -Xms6g -Xmx6g
    claims:
      - name: data
        mountPath: /var/lib/kafka/data
        size: 50Gi
        accessModes: [ReadWriteOnce]
    resources:
      requests:
        cpu: 500m
        memory: 8Gi
      limits:
        cpu: "2"
        memory: 10Gi
  redis:
    enabled: false
    image: redis
    serviceAccount: general
    replicas: 1
    headless: true
    ports:
      - name: redis
        port: 6379
        protocol: TCP
    probe:
      enabled: true
      type: tcp
      port: redis
      path: ""
      startupFailureThreshold: 30
      periodSeconds: 5
    env: {}
    configMapMounts:
      - {configMap: redis, mountPath: /etc/redis, readOnly: true}
    secretEnv: []
    claims:
      - name: data
        mountPath: /data
        size: 5Gi
        accessModes: [ReadWriteOnce]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  elasticsearch:
    enabled: false
    image: elasticsearch
    serviceAccount: general
    replicas: 1
    headless: true
    ports:
      - name: http
        port: 9200
        protocol: TCP
      - name: transport
        port: 9300
        protocol: TCP
    probe:
      enabled: true
      type: http
      port: http
      path: /_cluster/health
      startupFailureThreshold: 60
      periodSeconds: 10
    env:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    claims:
      - name: data
        mountPath: /usr/share/elasticsearch/data
        size: 100Gi
        accessModes: [ReadWriteOnce]
      - name: logs
        mountPath: /usr/share/elasticsearch/logs
        size: 20Gi
        accessModes: [ReadWriteOnce]
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  viosPostgres:
    enabled: false
    image: postgres
    serviceAccount: vios
    replicas: 1
    headless: true
    ports:
      - name: postgres
        port: 5432
        protocol: TCP
    probe:
      enabled: true
      type: tcp
      port: postgres
      path: ""
      startupFailureThreshold: 60
      periodSeconds: 5
    env:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_DB: vios
    configMapMounts:
      - {configMap: vios, mountPath: /etc/postgresql, readOnly: true}
    secretEnv: []
    claims:
      - name: data
        mountPath: /var/lib/postgresql/data
        size: 10Gi
        accessModes: [ReadWriteOnce]
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

