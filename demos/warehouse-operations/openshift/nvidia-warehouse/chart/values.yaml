# This chart is intentionally inert by default. Enabling it does not make the
# Warehouse profile deployable; see README.md and the acknowledgement gates.
global:
  enabled: false
  acknowledgeIncomplete: false
  allowGpuPlaceholders: false
  allowTagOnlyRender: false
  source:
    tag: v3.2.1
    commit: 7640d917047cf7b0fd3085eefb8282754b56bc94
    releaseMetadata: 3.2.1-26.07.1
  imagePullSecrets: []
  storageClass: vastdata-filesystem

nameOverride: ""
fullnameOverride: warehouse

serviceAccounts:
  general:
    create: true
    name: warehouse-general
  vios:
    create: true
    name: warehouse-vios
  sdrc:
    create: true
    name: warehouse-sdrc
  gpu:
    create: true
    name: warehouse-gpu

rbac:
  sdrcReadOnly:
    enabled: true

scheduling:
  cpu:
    nodeSelector:
      net-type: fi-attached
    tolerations: []
    affinity: {}
  gpu:
    nodeSelector:
      net-type: c845-cx7
    tolerations: []
    affinity: {}

security:
  pod:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

