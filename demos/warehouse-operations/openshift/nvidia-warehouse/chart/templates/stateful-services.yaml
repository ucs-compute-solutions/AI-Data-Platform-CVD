{{- include "nvidia-warehouse.assertSafety" . -}}
{{- if .Values.global.enabled }}
{{- range $key, $component := .Values.statefulServices }}
{{- if $component.enabled }}
{{- $name := include "nvidia-warehouse.componentName" (dict "root" $ "name" $key) }}
{{- $image := index $.Values.images $component.image }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nvidia-warehouse.labels" (dict "root" $ "component" $key) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nvidia-warehouse.selectorLabels" (dict "root" $ "component" $key) | nindent 4 }}
  ports:
    {{- range $component.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: {{ .protocol }}
    {{- end }}
{{- if $component.headless }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nvidia-warehouse.labels" (dict "root" $ "component" $key) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "nvidia-warehouse.selectorLabels" (dict "root" $ "component" $key) | nindent 4 }}
  ports:
    {{- range $component.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: {{ .protocol }}
    {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nvidia-warehouse.labels" (dict "root" $ "component" $key) | nindent 4 }}
spec:
  serviceName: {{ ternary (printf "%s-headless" $name) $name $component.headless }}
  replicas: {{ $component.replicas }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "nvidia-warehouse.selectorLabels" (dict "root" $ "component" $key) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nvidia-warehouse.selectorLabels" (dict "root" $ "component" $key) | nindent 8 }}
      annotations:
        warehouse.nvidia.com/design-status: render-only-incomplete
    spec:
      serviceAccountName: {{ include "nvidia-warehouse.serviceAccountName" (dict "root" $ "key" $component.serviceAccount) }}
      securityContext:
        {{- toYaml $.Values.security.pod | nindent 8 }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $key | kebabcase }}
          image: {{ include "nvidia-warehouse.image" (dict "root" $ "image" $image) }}
          imagePullPolicy: {{ $image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.security.container | nindent 12 }}
          ports:
            {{- range $component.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- if or $component.env $component.secretEnv }}
          env:
            {{- range $envName, $envValue := $component.env }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
            {{- range $secretEnv := $component.secretEnv }}
            {{- $secret := index $.Values.secretReferences $secretEnv.secret }}
            {{- if not $secret }}{{ fail (printf "statefulServices.%s references unknown secretReferences.%s" $key $secretEnv.secret) }}{{- end }}
            - name: {{ $secretEnv.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "secretReferences.%s.name is required" $secretEnv.secret) $secret.name }}
                  key: {{ required (printf "secretReferences.%s.key is required" $secretEnv.secret) $secret.key }}
            {{- end }}
          {{- end }}
          {{- if $component.probe.enabled }}
          startupProbe:
            {{- include "nvidia-warehouse.probeAction" (dict "probe" $component.probe) | nindent 12 }}
            failureThreshold: {{ $component.probe.startupFailureThreshold }}
            periodSeconds: {{ $component.probe.periodSeconds }}
          readinessProbe:
            {{- include "nvidia-warehouse.probeAction" (dict "probe" $component.probe) | nindent 12 }}
            failureThreshold: 3
            periodSeconds: {{ $component.probe.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          {{- if or $component.claims $component.configMapMounts }}
          volumeMounts:
            {{- range $component.claims }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- range $mount := $component.configMapMounts }}
            {{- $config := index $.Values.configMaps $mount.configMap }}
            {{- if not $config }}{{ fail (printf "statefulServices.%s references unknown configMaps.%s" $key $mount.configMap) }}{{- end }}
            {{- if not $config.enabled }}{{ fail (printf "statefulServices.%s requires configMaps.%s.enabled=true" $key $mount.configMap) }}{{- end }}
            - name: {{ printf "config-%s" ($mount.configMap | kebabcase) | trunc 63 | trimSuffix "-" }}
              mountPath: {{ $mount.mountPath }}
              readOnly: {{ $mount.readOnly }}
            {{- end }}
          {{- end }}
      {{- with $component.configMapMounts }}
      volumes:
        {{- range $mount := . }}
        - name: {{ printf "config-%s" ($mount.configMap | kebabcase) | trunc 63 | trimSuffix "-" }}
          configMap:
            name: {{ include "nvidia-warehouse.componentName" (dict "root" $ "name" $mount.configMap) }}
        {{- end }}
      {{- end }}
      nodeSelector:
        {{- toYaml $.Values.scheduling.cpu.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $.Values.scheduling.cpu.tolerations | nindent 8 }}
      affinity:
        {{- toYaml $.Values.scheduling.cpu.affinity | nindent 8 }}
  {{- with $component.claims }}
  volumeClaimTemplates:
    {{- range . }}
    - metadata:
        name: {{ .name }}
        labels:
          {{- include "nvidia-warehouse.labels" (dict "root" $ "component" $key) | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .accessModes | nindent 10 }}
        {{- with $.Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .size }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
